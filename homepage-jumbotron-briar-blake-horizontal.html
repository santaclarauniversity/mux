    <script>
(function () {
    "use strict";

    // Same breakpoint as the page CSS. Hover previews are desktop only.
    const mobile = window.matchMedia("(max-width: 1199px)");

    let item, thumbnail, preview, player, overlay, exitButton;

    function set_active(e) {
        e.classList.remove("inactive");
        e.classList.add("active");
    }

    function set_inactive(e) {
        e.classList.remove("active");
        e.classList.add("inactive");
    }

    function is_playing() {
        return player.classList.contains("active");
    }

    // swaps the thumbnail for the animated preview, unless the video is open
    function show_preview() {
        if (is_playing()) return;
        set_inactive(thumbnail);
        set_active(preview);
    }

    // swaps the animated preview back to the thumbnail, unless the video is open
    function show_thumbnail() {
        if (is_playing()) return;
        set_inactive(preview);
        set_active(thumbnail);
    }

    // hides the thumbnail, preview and overlay, then shows and starts the player
    function play_short() {
        set_inactive(overlay);
        set_inactive(thumbnail);
        set_inactive(preview);
        set_active(player);
        set_active(exitButton);

        // play() returns a promise that rejects if the browser blocks playback,
        // so swallow that rather than throwing.
        if (typeof player.play === "function") {
            player.play().catch(function () {});
        }
    }

    // stops the player and returns to the thumbnail with the play overlay.
    // display:none does NOT stop playback on the mux-player web component, so
    // it must be paused explicitly whenever it is hidden.
    function reset_short() {
        if (typeof player.pause === "function") {
            player.pause();
            player.currentTime = 0;
        }
        set_inactive(player);
        set_inactive(exitButton);
        set_inactive(preview);
        set_active(thumbnail);
        set_active(overlay);
    }

    // runs handler on Enter or Space, for role="button" elements
    function on_activate_key(handler) {
        return function (event) {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault(); // Prevent default space scrolling behavior
                handler();
            }
        };
    }

    function init() {
        item = document.getElementById("short_1");
        if (!item) return;

        thumbnail = document.getElementById("thumbnail_1");
        preview = document.getElementById("preview_video_1");
        player = document.getElementById("shorts_video_1");
        overlay = document.getElementById("overlay_1");
        exitButton = document.getElementById("exit_1");

        const playButton = document.getElementById("play_1");
        playButton.addEventListener("click", play_short);
        playButton.addEventListener("keydown", on_activate_key(play_short));

        exitButton.addEventListener("click", reset_short);
        exitButton.addEventListener("keydown", on_activate_key(reset_short));

        item.addEventListener("mouseenter", function () {
            if (!mobile.matches) show_preview();
        });
        item.addEventListener("mouseleave", function () {
            if (!mobile.matches) show_thumbnail();
        });

        // switching between the mobile and desktop layouts starts over
        mobile.addEventListener("change", reset_short);

        // open on the animated preview
        show_preview();
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
})();
</script>
